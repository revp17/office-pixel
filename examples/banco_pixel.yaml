company: Banco Pixel

calendar:
  workDays: [0, 1, 2, 3, 4]          # lunes a viernes
  hours: { start: "09:00", end: "18:00" }
  breaks: [{ start: "13:00", end: "14:00" }]
  absenteeism: 0.03

travel: { sameTeam: 0, sameArea: 2, crossArea: 5 }   # minutos de traslado de un caso

schedules:
  turno_tarde:
    hours: { start: "12:00", end: "21:00" }
    breaks: [{ start: "16:00", end: "17:00" }]

meetings:
  - { id: daily_riesgos,   unit: riesgos,    start: "09:15", minutes: 15 }
  - { id: daily_ops,       unit: operaciones, start: "09:00", minutes: 10 }
  - { id: daily_atencion,  unit: atencion,   start: "09:00", minutes: 10 }
  - { id: comite_riesgos,  unit: riesgos,    start: "15:00", minutes: 60, days: [0] }

units:
  - id: comercial
    name: Comercial
    children:
      - { id: ventas, name: Ventas }
  - id: operaciones
    name: Operaciones
    children:
      - { id: kyc, name: Validación KYC }
      - { id: formalizacion, name: Formalización }
  - id: riesgos
    name: Riesgos
    children:
      - { id: analisis, name: Análisis }
      - { id: senior, name: Riesgos senior }
  - id: legal
    name: Legal y Cumplimiento
    children:
      - { id: contratos, name: Contratos }
      - { id: cumplimiento, name: Cumplimiento }
  - id: atencion
    name: Atención al cliente
    children:
      - { id: contact_center, name: Contact center }

