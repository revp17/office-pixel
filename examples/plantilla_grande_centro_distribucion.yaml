processes:
  # ---- Ingreso de productos ----
  - id: ingreso_producto
    name: Ingreso de productos
    arrivals: { type: poisson, ratePerHour: 4 }
    attributes:
      pallets: { dist: lognormal, median: 12, sigma: 0.6 }
    stages:
      - id: control_acceso
        label: Controlar el ingreso del camión
        unit: accesos
        role: guardia
        duration: { dist: normal, meanMinutes: 7, sdMinutes: 2 }
        next: descarga
      - id: descarga
        label: Descargar en el muelle
        unit: muelles_entrada
        role: estibador
        duration: { dist: lognormal, medianMinutes: 35, sigma: 0.4 }
        next: calidad
      - id: calidad
        label: Control de calidad y conteo
        unit: control_calidad
        role: inspector
        duration: { dist: normal, meanMinutes: 22, sdMinutes: 6 }
        sla: { maxMinutes: 240 }
        exceptions:
          - { id: rechazo_calidad, probability: 0.05, action: goto, target: devolucion }
        next:
          - { when: "case.pallets > 15", to: ubicacion_seca }
          - { otherwise: true, to: ubicacion_frio }
      - id: ubicacion_seca
        label: Ubicar en bodega seca
        unit: bodega_seca
        role: bodeguero
        duration: { dist: normal, meanMinutes: 30, sdMinutes: 8 }
        next: registro_inventario
      - id: ubicacion_frio
        label: Ubicar en cadena de frío
        unit: cadena_frio
        role: bodeguero_frio
        duration: { dist: normal, meanMinutes: 25, sdMinutes: 6 }
        next: registro_inventario
      - id: registro_inventario
        label: Registrar en inventario
        unit: inventarios
        role: auditor_inventario
        duration: { dist: normal, meanMinutes: 10, sdMinutes: 3 }
        terminal: true
      - id: devolucion
        label: Devolución al proveedor
        terminal: true

  # ---- Pedido y despacho ----
  - id: despacho_pedido
    name: Preparación y despacho de pedidos
    arrivals: { type: poisson, ratePerHour: 12 }
    dependsOn:
      - { process: ingreso_producto, kind: requiere, atStage: registro_inventario, note: "El picking necesita el stock registrado en inventario" }
    stages:
      - id: recepcion_pedido
        label: Recibir el pedido
        unit: servicio
        role: agente
        duration: { dist: normal, meanMinutes: 7, sdMinutes: 2 }
        next: picking
      - id: picking
        label: Picking en bodega
        unit: picking
        role: preparador
        duration: { dist: normal, meanMinutes: 22, sdMinutes: 7 }
        sla: { maxMinutes: 300 }
        exceptions:
          - { id: faltante, probability: 0.07, action: goto, target: reposicion }
        next: empaque
      - id: empaque
        label: Empacar y etiquetar
        unit: empaque
        role: empacador
        duration: { dist: normal, meanMinutes: 12, sdMinutes: 3 }
        next: ruta
      - id: ruta
        label: Asignar a una ruta
        unit: rutas
        role: planificador_rutas
        duration: { dist: normal, meanMinutes: 8, sdMinutes: 2 }
        next: carga
      - id: carga
        label: Cargar en el muelle de salida
        unit: muelles_salida
        role: despachador
        duration: { dist: normal, meanMinutes: 14, sdMinutes: 4 }
        next: entrega
      - id: entrega
        label: Transportar y entregar
        unit: choferes
        role: conductor
        duration: { dist: normal, meanMinutes: 100, sdMinutes: 30 }
        terminal: true
      - id: reposicion
        label: Faltante, a reposición
        terminal: true

  # ---- Mantenimiento ----
  - id: orden_mantenimiento
    name: Orden de mantenimiento
    arrivals: { type: poisson, ratePerHour: 1.2 }
    dependsOn:
      - { process: alerta_seguridad, kind: dispara, atStage: informe, probability: 0.2, note: "Una alerta confirmada suele dejar daños que reparar" }
    attributes:
      tipo: { dist: lognormal, median: 5, sigma: 0.7 }
    stages:
      - id: solicitud
        label: Solicitar mantenimiento
        unit: almacenamiento
        role: jefe_almacen
        duration: { dist: normal, meanMinutes: 5, sdMinutes: 1 }
        next: clasificar
      - id: clasificar
        label: Clasificar y priorizar
        unit: mantenimiento
        role: jefe_mantenimiento
        duration: { dist: normal, meanMinutes: 6, sdMinutes: 2 }
        next:
          - { when: "case.tipo > 7", to: reparacion_mecanica }
          - { when: "case.tipo > 3", to: reparacion_electrica }
          - { otherwise: true, to: trabajo_infraestructura }
      - id: reparacion_mecanica
        label: Reparación mecánica
        unit: mecanico
        role: mecánico
        duration: { dist: lognormal, medianMinutes: 70, sigma: 0.5 }
        sla: { maxMinutes: 720 }
        next: cierre
      - id: reparacion_electrica
        label: Reparación eléctrica
        unit: electrico
        role: electricista
        duration: { dist: lognormal, medianMinutes: 50, sigma: 0.5 }
        sla: { maxMinutes: 720 }
        next: cierre
      - id: trabajo_infraestructura
        label: Trabajo de infraestructura
        unit: infraestructura
        role: operario_mantenimiento
        duration: { dist: lognormal, medianMinutes: 40, sigma: 0.5 }
        next: cierre
      - id: cierre
        label: Verificar y cerrar la orden
        unit: mantenimiento
        role: jefe_mantenimiento
        duration: { dist: fixed, minutes: 6 }
        terminal: true

  # ---- Seguridad ----
  - id: alerta_seguridad
    name: Alerta de seguridad
    arrivals: { type: poisson, ratePerHour: 0.8 }
    stages:
      - id: deteccion
        label: Detectar la alerta en cámaras
        unit: cctv
        role: operador_cctv
        duration: { dist: normal, meanMinutes: 3, sdMinutes: 1 }
        next: ronda
      - id: ronda
        label: Verificar en sitio
        unit: patrimonial
        role: supervisor_ronda
        duration: { dist: normal, meanMinutes: 14, sdMinutes: 4 }
        sla: { maxMinutes: 60 }
        exceptions:
          - { id: falsa_alarma, probability: 0.55, action: goto, target: cerrada }
        next: informe
      - id: informe
        label: Informe al jefe de seguridad
        unit: seguridad
        role: jefe_seguridad
        duration: { dist: normal, meanMinutes: 20, sdMinutes: 6 }
        terminal: true
      - id: cerrada
        label: Cerrada, falsa alarma
        terminal: true
