company: Centro de Distribución Pacífico

# Plantilla de empresa GRANDE (62 personas): un centro de distribución con dirección, compras,
# recepción, almacenamiento, preparación y despacho, transporte, seguridad, mantenimiento y atención.

calendar:
  workDays: [0, 1, 2, 3, 4, 5]
  hours: { start: "06:00", end: "18:00" }
  breaks: [{ start: "12:00", end: "13:00" }]
  absenteeism: 0.04

travel: { sameTeam: 0, sameArea: 3, crossArea: 7 }

schedules:
  turno_tarde:
    hours: { start: "10:00", end: "22:00" }
    breaks: [{ start: "15:00", end: "16:00" }]

meetings:
  - { id: daily_operaciones, unit: almacenamiento, start: "06:15", minutes: 15 }
  - { id: daily_despacho, unit: preparacion, start: "06:30", minutes: 10 }
  - { id: comite_seguridad, unit: seguridad, start: "08:00", minutes: 45, days: [0] }

units:
  - id: direccion
    name: Dirección y administración
    children:
      - { id: compras, name: Compras y planificación }
  - id: recepcion_area
    name: Recepción e ingreso
    facility: ingreso
    children:
      - { id: muelles_entrada, name: Muelles de descarga, facility: ingreso }
      - { id: control_calidad, name: Control de calidad, facility: ingreso }
  - id: almacenamiento
    name: Almacenamiento
    children:
      - { id: bodega_seca, name: Bodega seca, facility: bodega }
      - { id: cadena_frio, name: Cadena de frío, facility: bodega }
      - { id: inventarios, name: Inventarios }
  - id: preparacion
    name: Preparación y despacho
    children:
      - { id: picking, name: Picking, facility: bodega }
      - { id: empaque, name: Empaque, facility: despacho }
      - { id: muelles_salida, name: Muelles de salida, facility: despacho }
  - id: flota
    name: Transporte y flota
    facility: transporte
    children:
      - { id: rutas, name: Planificación de rutas }
      - { id: choferes, name: Conductores, facility: transporte }
  - id: seguridad
    name: Seguridad
    facility: seguridad
    children:
      - { id: accesos, name: Control de accesos, facility: seguridad }
      - { id: cctv, name: Monitoreo CCTV, facility: seguridad }
      - { id: patrimonial, name: Seguridad patrimonial, facility: seguridad }
  - id: mantenimiento
    name: Mantenimiento
    facility: mantenimiento
    children:
      - { id: mecanico, name: Mecánico, facility: mantenimiento }
      - { id: electrico, name: Eléctrico, facility: mantenimiento }
      - { id: infraestructura, name: Infraestructura y limpieza, facility: mantenimiento }
  - id: atencion
    name: Atención al cliente
    children:
      - { id: servicio, name: Servicio y reclamos }

