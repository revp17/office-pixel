  - { id: f1, name: Hugo Salas,    unit: formalizacion, role: formalizador, reportsTo: jefa_ops, kind: responsable }
  - { id: f2, name: Marta Gil,     unit: formalizacion, role: formalizador, reportsTo: jefa_ops, speed: 1.1 }
  - { id: f3, name: Raúl Vega,     unit: formalizacion, role: formalizador, reportsTo: jefa_ops, errorRate: 0.03 }
  # Riesgos
