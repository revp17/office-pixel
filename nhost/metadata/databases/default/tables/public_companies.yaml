table:
  name: companies
  schema: public
# El usuario solo ve, crea, cambia y borra SUS empresas (user_id = su identificador).
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        user_id: x-hasura-user-id
      columns:
        - name
        - yaml
        - bootstrap
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - yaml
        - yaml_bytes
        - version
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - yaml
        - change_note
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
