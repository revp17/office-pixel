  - { id: k2, name: Irene Vidal,   unit: kyc, role: operador_kyc, reportsTo: jefa_ops, speed: 1.15 }
  - { id: k3, name: Tomás Ortega,  unit: kyc, role: operador_kyc, reportsTo: jefa_ops }
