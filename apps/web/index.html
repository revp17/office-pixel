<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office-Pixel</title>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <div id="toolbar">
          <label class="inl" title="Empresas guardadas en la base de datos">Empresa
            <select id="company-pick"></select>
          </label>
          <span class="menuwrap">
            <button id="company-menu" title="Nueva, duplicar, versiones anteriores, borrar">⋯</button>
            <div id="company-actions" hidden>
              <button type="button" data-a="new">＋ Nueva empresa en blanco</button>
              <button type="button" data-a="dup">⧉ Duplicar esta empresa</button>
              <button type="button" data-a="versions">🕘 Versiones anteriores…</button>
              <button type="button" data-a="backup">⬇ Descargar copia (.yaml)</button>
              <button type="button" data-a="delete" class="danger">🗑 Borrar esta empresa</button>
              <button type="button" id="sign-out" hidden>🚪 Cerrar sesión</button>
            </div>
          </span>
          <span id="db-status" class="dbstatus" role="status"></span>
          <span class="sep"></span>
          <button id="configure" class="primary" title="Áreas, personas, procesos, reglas y excepciones">⚙ Configurar empresa</button>
          <button id="processes" title="Documentar procesos (5 fases), optimizarlos (5 pasos) y generar la ficha">📋 Procesos</button>
          <button id="reset-all" title="Borra todo lo guardado (empresa, procesos, procedimientos, preferencias) y deja una empresa en blanco para probar la tuya">🧹 Limpiar todo</button>
          <label class="inl" title="«Cómo funciona»: pocos casos, ritmo lento y relato en palabras para entender el proceso. «Semana completa»: la carga real, rápido, para ver resultados.">Modo
            <select id="mode">
              <option value="explain">🎓 Cómo funciona</option>
              <option value="week">📅 Semana completa</option>
            </select>
          </label>
          <button id="play">▶ Reproducir</button>
          <button id="step" title="Avanza hasta el siguiente hecho (llega un caso, alguien empieza o termina, el caso viaja…) y se detiene">⏭ Siguiente paso</button>
          <button id="restart">⟲ Reiniciar</button>
          <label>Velocidad
            <select id="speed">
              <option value="1">1 min/s (muy lento)</option>
              <option value="2">2 min/s</option>
              <option value="5">5 min/s</option>
              <option value="10">10 min/s</option>
              <option value="30" selected>30 min/s</option>
              <option value="60">1 h/s</option>
              <option value="240">4 h/s</option>
              <option value="720">12 h/s</option>
            </select>
          </label>
          <input id="timeline" type="range" min="0" max="7200" step="1" value="0" />
          <span id="clock">Día 1 · Lun 00:00</span>
          <button id="fit" title="Encuadrar toda la planta">Vista general</button>
          <div class="seg" id="layout" role="group" aria-label="Disposición de las áreas en la planta">
            <button type="button" data-o="vertical" title="Áreas apiladas de arriba abajo">▤ Vertical</button>
            <button type="button" data-o="horizontal" title="Áreas en fila, de izquierda a derecha">▥ Horizontal</button>
          </div>
          <span class="sep"></span>
          <label class="inl">Días <input id="days" type="number" value="5" min="1" max="30" /></label>
          <label class="inl">Semilla <input id="seed" type="number" value="1" /></label>
          <button id="simulate" title="Volver a simular con estos días y esta semilla">↻ Simular</button>
        </div>
        <div id="preview-banner" hidden>
          <span id="preview-text"></span>
          <button id="preview-exit" type="button">Volver a la empresa real</button>
        </div>
        <div id="floors"></div>
        <div id="progress"><div id="progress-fill"></div><span id="progress-text"></span></div>
        <div id="game"><aside id="story"></aside></div>
        <section id="bottom">
          <div id="kpis"></div>
          <div id="units"></div>
          <div id="people"></div>
          <div id="detail"><p class="hint">Haz clic en una persona del edificio o de la lista para ver su día.</p></div>
        </section>
      </main>
    </div>
    <div id="config-root"></div>
    <div id="hub-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
